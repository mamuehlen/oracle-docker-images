name: Build and push Oracle DB image

# Manual trigger only - this repo is private, but the self-hosted runner's
# mounted docker socket is effectively root on the host, so no automatic
# triggers (push/pull_request) are wired up here on purpose.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under OracleDatabase/SingleInstance/dockerfiles/ (e.g. 19.3.0, 23.26.0)"
        required: true
      edition_flag:
        description: "Edition flag for buildContainerImage.sh: -e (EE), -s (SE2), -x (XE), -f (Free)"
        required: true
        default: "-s"
      patching:
        description: "Also apply the extensions/patching extension (-p)"
        type: boolean
        default: false
      regenerate_seed:
        description: >-
          (only with patching) Rebuild the dbca seed template at the patched
          RU level so new containers skip the ~30 min datapatch run at first
          start. Adds ~45 min to the build. Uncheck to keep the stock 19.3
          seed. See extensions/patching/README.md.
        type: boolean
        default: true
      image_tag:
        description: "Local image name:tag to build, e.g. oracle/database:19.32.0.0-se2"
        required: true
      build_arg_overrides:
        description: 'Optional passthrough, e.g. --build-arg INSTALL_FILE_1=foo.zip'
        required: false
        default: ""
      fetch_map:
        description: >-
          One "zft/relative/path/file.zip repo/relative/dest/dir" pair per
          line - the RU/DPBP/OPatch patches and the base installer/goldimage
          don't live in the same repo directory, so a single source+dest
          pair isn't enough. Example for the 19.32 SE2 build:
          ora/Ora19/LINUX.X64_193000_db_home.zip OracleDatabase/SingleInstance/dockerfiles/19.3.0
          ora/Ora19/patches/p6880880_190000_LINUX.zip OracleDatabase/SingleInstance/extensions/patching/patches/one_offs
          ora/Ora19/patches/p39657094_1932000DBRU_Generic.zip OracleDatabase/SingleInstance/extensions/patching/patches/one_offs
          ora/Ora19/patches/p39472050_190000_Linux-x86-64.zip OracleDatabase/SingleInstance/extensions/patching/patches/release_update
        required: true
      push_tag:
        description: "Tag to push to vsdock01.pcsoft.de:5000, e.g. oracle/database:19.32.0.0-se2"
        required: true
      expected_patches:
        description: >-
          Space-separated OPatch patch numbers that must show up in
          `opatch lspatches` before pushing is allowed, e.g.
          "39472050 39657094" for the 19.32 SE2 build. Leave empty to
          skip this check. This is the safety net against a forgotten
          `patching` checkbox or a bad fetch_map shipping an unpatched
          image with a patched-looking tag - it happened twice before
          this check existed (see CI.md).
        required: false
        default: ""
      build_faststart:
        description: >-
          (only with patching) Also build the extensions/faststart
          extension on top of the patched+seeded image: ships a fully
          pre-created CDB$ROOT+PDB$SEED plus both AL32UTF8 and
          WE8ISO8859P15 customer-PDB variants, skipping dbca
          -createDatabase entirely at container start (~49s vs ~8-9 min).
          See extensions/patching/README.md's faststart section. Pushed
          as "<push_tag>-faststart".
        type: boolean
        default: false
  # TEMPORARY: workflow_dispatch (UI or API) 404s for a workflow that has
  # never run and isn't on the default branch - this push trigger exists
  # only to bootstrap that first run, then gets removed again. The job
  # is guarded by `if:` below so a push-triggered run does nothing but
  # register the workflow's existence with GitHub.
  push:
    branches: [zedas-patches]
    paths: [.github/workflows/build-and-push.yml]

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4

      # https://zft.zedas.com/download/ aliases /home/pcsmailuser directly
      # with no auth_basic/auth_request on that nginx location - it's
      # currently unauthenticated (confirmed via a plain curl from outside
      # the corp network). The -u below is forward-compatible: it's a
      # no-op against an unauthenticated endpoint, but starts working the
      # moment someone adds auth_basic to that location (which they should
      # - this serves licensed Oracle installers to anyone who guesses the
      # URL right now).
      - name: Download Oracle installer/patch files from zft.zedas.com
        env:
          ZFT_USER: ${{ secrets.ZFT_USER }}
          ZFT_PASSWORD: ${{ secrets.ZFT_PASSWORD }}
          FETCH_MAP: ${{ inputs.fetch_map }}
        run: |
          set -euo pipefail
          while read -r src dest; do
            [ -z "$src" ] && continue
            mkdir -p "$dest"
            curl -fsSL -u "${ZFT_USER}:${ZFT_PASSWORD}" \
              "https://zft.zedas.com/download/${src}" -o "${dest}/$(basename "$src")"
          done <<< "$FETCH_MAP"

      - name: Build image
        id: build
        working-directory: OracleDatabase/SingleInstance/dockerfiles
        env:
          # Build options for the patching *extension* (buildContainerImage.sh
          # does not forward -o to it - see the comment there). Boolean inputs
          # are used directly, never compared to 'true' (see CI.md).
          PATCHING_BUILD_OPTS: ${{ inputs.patching && !inputs.regenerate_seed && '--build-arg REGENERATE_SEED=false' || '' }}
        run: |
          set -euo pipefail
          echo "PATCHING_BUILD_OPTS='${PATCHING_BUILD_OPTS}'"
          ./buildContainerImage.sh \
            -v "${{ inputs.version }}" \
            ${{ inputs.edition_flag }} \
            ${{ inputs.patching && '-p' || '' }} \
            -t "${{ inputs.image_tag }}" \
            ${{ inputs.build_arg_overrides != '' && format('-o "{0}"', inputs.build_arg_overrides) || '' }}
          # buildContainerImage.sh -p never overwrites the requested
          # image_tag - it writes the patched result as "<image_tag>-ext"
          # instead, so that's the one downstream steps need to use
          # whenever patching was applied.
          SRC_TAG="${{ inputs.image_tag }}"
          if [ "${{ inputs.patching }}" = "true" ]; then
            SRC_TAG="${SRC_TAG}-ext"
          fi
          echo "src_tag=${SRC_TAG}" >> "$GITHUB_OUTPUT"

      # Safety net: a forgotten `patching` checkbox, a broken fetch_map, or
      # a GitHub Actions expression bug (all three have actually happened -
      # see CI.md) would otherwise silently ship an unpatched image under a
      # patched-looking tag. Fails loudly instead if expected_patches is set.
      - name: Verify patch level
        if: inputs.expected_patches != ''
        run: |
          set -euo pipefail
          ACTUAL=$(docker run --rm --entrypoint bash "${{ steps.build.outputs.src_tag }}" \
            -c '$ORACLE_HOME/OPatch/opatch lspatches')
          echo "$ACTUAL"
          MISSING=""
          for p in ${{ inputs.expected_patches }}; do
            if ! grep -q "^${p};" <<< "$ACTUAL"; then
              MISSING="${MISSING} ${p}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing expected patch(es):${MISSING} - refusing to push ${{ steps.build.outputs.src_tag }}"
            exit 1
          fi

      # Second safety net, for the regenerated seed: dbca.rsp.tmpl must point
      # at a template that actually exists in the image, and when
      # regenerate_seed was requested it must not be the stock one (a silently
      # skipped seedgen stage would otherwise ship a "fast start" image that
      # still runs datapatch for 30 minutes).
      - name: Verify seed template
        if: inputs.patching
        env:
          REGENERATE_SEED: ${{ inputs.regenerate_seed }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash -e REGENERATE_SEED="${REGENERATE_SEED}" "${{ steps.build.outputs.src_tag }}" -c '
            set -euo pipefail
            T=$ORACLE_HOME/assistants/dbca/templates
            TPL=$(sed -n "s/^templateName=//p" $ORACLE_BASE/scripts/base/dbca.rsp.tmpl)
            echo "dbca.rsp.tmpl templateName=${TPL}"
            [ -f "$T/${TPL}" ] || { echo "::error::template ${TPL} missing in $T"; ls -l $T; exit 1; }
            if [ "${REGENERATE_SEED}" = "true" ]; then
              [ "${TPL}" != "General_Purpose.dbc" ] || { echo "::error::regenerate_seed requested but image still uses the stock seed"; exit 1; }
              [ ! -f "$T/Seed_Database.dfb" ] || { echo "::error::stock Seed_Database.dfb still present"; exit 1; }
              cat "$T/${TPL%.dbc}.README"
            else
              [ "${TPL}" = "General_Purpose.dbc" ] || { echo "::error::regenerate_seed=false but templateName is ${TPL}"; exit 1; }
            fi
            ls -l $T | awk "NR>1 {printf \"%8.1f MB  %s\n\", \$5/1048576, \$9}"'

      # build_faststart requires patching: the extension builds FROM the
      # patched+seeded -ext image (src_tag) and its own Dockerfile also
      # needs "<image_tag>-base" (the lean, pre-patching sibling) - which
      # buildContainerImage.sh -p's own internal buildExtensions.sh call
      # already built and tagged as a side effect of the "Build image"
      # step above, precisely because patching was requested. Without
      # patching there is no -ext image and no -base sibling to build from.
      - name: Build faststart extension
        id: faststart
        if: inputs.build_faststart
        working-directory: OracleDatabase/SingleInstance/extensions
        run: |
          set -euo pipefail
          if [ "${{ inputs.patching }}" != "true" ]; then
            echo "::error::build_faststart requires patching to also be enabled (faststart builds FROM the patched+seeded -ext image)"
            exit 1
          fi
          FASTSTART_TAG="${{ steps.build.outputs.src_tag }}-faststart"
          ./buildExtensions.sh \
            -b "${{ steps.build.outputs.src_tag }}" \
            -t "${FASTSTART_TAG}" \
            -x faststart \
            -o "--build-arg BASE_IMAGE_LEAN=${{ inputs.image_tag }}-base"
          echo "faststart_tag=${FASTSTART_TAG}" >> "$GITHUB_OUTPUT"

      # Smoke test both character-set variants end-to-end (decompress,
      # instance start, variant selection, ready) - faststart's own new
      # failure modes (wrong PDB kept/dropped, PLUG IN/rename breaking)
      # aren't covered by the patch-level/seed-template checks above,
      # which only apply to src_tag, not this repackaged derivative.
      - name: Verify faststart image
        if: inputs.build_faststart
        run: |
          set -euo pipefail
          for charset in AL32UTF8 WE8ISO8859P15; do
            echo "::group::Testing ORACLE_CHARACTERSET=${charset}"
            CID=$(docker run -d -e ORACLE_PWD=Welcome1 -e ORACLE_CHARACTERSET="${charset}" \
              "${{ steps.faststart.outputs.faststart_tag }}")
            READY=""
            for _ in $(seq 1 60); do
              if docker logs "$CID" 2>&1 | grep -q "DATABASE IS READY TO USE"; then
                READY=1
                break
              fi
              if docker logs "$CID" 2>&1 | grep -qE "ORA-|E R R O R"; then
                break
              fi
              sleep 3
            done
            docker logs "$CID" 2>&1 | tail -100
            docker rm -f "$CID" >/dev/null
            echo "::endgroup::"
            if [ -z "$READY" ]; then
              echo "::error::faststart image did not become ready with ORACLE_CHARACTERSET=${charset} - see log above"
              exit 1
            fi
          done

      # One-time host setup required before this step works:
      # add "vsdock01.pcsoft.de:5000" to /etc/docker/daemon.json's
      # "insecure-registries" on the runner host and restart docker,
      # since that endpoint is plain HTTP (bypasses the Traefik proxy
      # in front of the HTTPS route on purpose - see the 499/timeout
      # investigation this workflow grew out of).
      - name: Push to internal registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_PASSWORD}" | docker login vsdock01.pcsoft.de:5000 -u "${REGISTRY_USER}" --password-stdin
          docker tag "${{ steps.build.outputs.src_tag }}" "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}"
          docker push "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}"
          if [ "${{ inputs.build_faststart }}" = "true" ]; then
            docker tag "${{ steps.faststart.outputs.faststart_tag }}" "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}-faststart"
            docker push "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}-faststart"
          fi
