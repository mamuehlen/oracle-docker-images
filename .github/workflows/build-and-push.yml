name: Build and push Oracle DB image

# Manual trigger only - this repo is private, but the self-hosted runner's
# mounted docker socket is effectively root on the host, so no automatic
# triggers (push/pull_request) are wired up here on purpose.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version directory under OracleDatabase/SingleInstance/dockerfiles/ (e.g. 19.3.0, 23.26.0)"
        required: true
      edition_flag:
        description: "Edition flag for buildContainerImage.sh: -e (EE), -s (SE2), -x (XE), -f (Free)"
        required: true
        default: "-s"
      patching:
        description: "Also apply the extensions/patching extension (-p)"
        type: boolean
        default: false
      image_tag:
        description: "Local image name:tag to build, e.g. oracle/database:19.32.0.0-se2"
        required: true
      build_arg_overrides:
        description: 'Optional passthrough, e.g. --build-arg INSTALL_FILE_1=foo.zip'
        required: false
        default: ""
      fetch_map:
        description: >-
          One "zft/relative/path/file.zip repo/relative/dest/dir" pair per
          line - the RU/DPBP/OPatch patches and the base installer/goldimage
          don't live in the same repo directory, so a single source+dest
          pair isn't enough. Example for the 19.32 SE2 build:
          ora/Ora19/LINUX.X64_193000_db_home.zip OracleDatabase/SingleInstance/dockerfiles/19.3.0
          ora/Ora19/patches/p6880880_190000_LINUX.zip OracleDatabase/SingleInstance/extensions/patching/patches/one_offs
          ora/Ora19/patches/p39657094_1932000DBRU_Generic.zip OracleDatabase/SingleInstance/extensions/patching/patches/one_offs
          ora/Ora19/patches/p39472050_190000_Linux-x86-64.zip OracleDatabase/SingleInstance/extensions/patching/patches/release_update
        required: true
      push_tag:
        description: "Tag to push to vsdock01.pcsoft.de:5000, e.g. oracle/database:19.32.0.0-se2"
        required: true
  # TEMPORARY: workflow_dispatch (UI or API) 404s for a workflow that has
  # never run and isn't on the default branch - this push trigger exists
  # only to bootstrap that first run, then gets removed again. The job
  # is guarded by `if:` below so a push-triggered run does nothing but
  # register the workflow's existence with GitHub.
  push:
    branches: [zedas-patches]
    paths: [.github/workflows/build-and-push.yml]

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4

      # https://zft.zedas.com/download/ aliases /home/pcsmailuser directly
      # with no auth_basic/auth_request on that nginx location - it's
      # currently unauthenticated (confirmed via a plain curl from outside
      # the corp network). The -u below is forward-compatible: it's a
      # no-op against an unauthenticated endpoint, but starts working the
      # moment someone adds auth_basic to that location (which they should
      # - this serves licensed Oracle installers to anyone who guesses the
      # URL right now).
      - name: Download Oracle installer/patch files from zft.zedas.com
        env:
          ZFT_USER: ${{ secrets.ZFT_USER }}
          ZFT_PASSWORD: ${{ secrets.ZFT_PASSWORD }}
          FETCH_MAP: ${{ inputs.fetch_map }}
        run: |
          set -euo pipefail
          while read -r src dest; do
            [ -z "$src" ] && continue
            mkdir -p "$dest"
            curl -fsSL -u "${ZFT_USER}:${ZFT_PASSWORD}" \
              "https://zft.zedas.com/download/${src}" -o "${dest}/$(basename "$src")"
          done <<< "$FETCH_MAP"

      - name: Build image
        working-directory: OracleDatabase/SingleInstance/dockerfiles
        run: |
          set -euo pipefail
          ./buildContainerImage.sh \
            -v "${{ inputs.version }}" \
            ${{ inputs.edition_flag }} \
            ${{ inputs.patching == 'true' && '-p' || '' }} \
            -t "${{ inputs.image_tag }}" \
            ${{ inputs.build_arg_overrides != '' && format('-o "{0}"', inputs.build_arg_overrides) || '' }}

      # One-time host setup required before this step works:
      # add "vsdock01.pcsoft.de:5000" to /etc/docker/daemon.json's
      # "insecure-registries" on the runner host and restart docker,
      # since that endpoint is plain HTTP (bypasses the Traefik proxy
      # in front of the HTTPS route on purpose - see the 499/timeout
      # investigation this workflow grew out of).
      - name: Push to internal registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          # buildContainerImage.sh -p never overwrites the requested
          # image_tag - it writes the patched result as "<image_tag>-ext"
          # instead, so that's the one to push when patching was applied.
          SRC_TAG="${{ inputs.image_tag }}"
          if [ "${{ inputs.patching }}" = "true" ]; then
            SRC_TAG="${SRC_TAG}-ext"
          fi
          echo "${REGISTRY_PASSWORD}" | docker login vsdock01.pcsoft.de:5000 -u "${REGISTRY_USER}" --password-stdin
          docker tag "${SRC_TAG}" "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}"
          docker push "vsdock01.pcsoft.de:5000/${{ inputs.push_tag }}"
